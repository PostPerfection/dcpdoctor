name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:VCPKG_BUILD_TYPE = "release"
          # vcpkg reads curl 56 and 503 off github's archive host as permanent and
          # refuses to retry the source download, so retry the whole install
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            vcpkg install openssl xerces-c libxml2[tools] --triplet x64-windows
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 5) { throw "vcpkg install failed after $attempt attempts" }
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Set vcpkg env (Windows)
        if: runner.os == 'Windows'
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/libxml2" >> $env:GITHUB_PATH

      - name: Install xmllint (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1.tar.xz
          tar -xJf ffmpeg.tar.xz
          echo "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-27-16-45/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1.zip
          unzip -q ffmpeg.zip
          echo "$(cygpath -w "$PWD/ffmpeg-n8.1.2-47-g156bb4d299-win64-gpl-8.1/bin")" >> "$GITHUB_PATH"

      # homebrew's ffmpeg has no libass or freetype
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ffmpeg
          create-args: ffmpeg=8.1.1=gpl_h4b93310_102
          init-shell: none

      - name: Put ffmpeg on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(dirname "$("${MAMBA_EXE:-micromamba}" run -n ffmpeg which ffmpeg)")" >> "$GITHUB_PATH"

      - name: Check test tools
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          xmllint --version

      # the patch means local builds never fetch the pinned rev, so nothing else
      # would notice the two drifting apart
      - name: postkit pin matches the submodule
        if: runner.os == 'Linux'
        run: |
          pinned=$(grep -oP 'postkit = \{ git =.*rev = "\K[0-9a-f]+' rust/Cargo.toml)
          actual=$(git rev-parse HEAD:extern/postkit)
          if [ -z "$pinned" ] || [ "${actual#"$pinned"}" = "$actual" ]; then
            echo "rust/Cargo.toml pins postkit '$pinned' but extern/postkit is $actual" >&2
            exit 1
          fi

      - name: Install coverage tooling (Linux)
        if: runner.os == 'Linux'
        run: rustup component add llvm-tools-preview

      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-llvm-cov

      - name: Build
        working-directory: rust
        run: cargo build --workspace

      # llvm-cov runs the same tests instrumented, so Linux tests them once here
      - name: Test with coverage (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: lcov
          path: rust/lcov.info

      - name: Test
        if: runner.os != 'Linux'
        working-directory: rust
        run: cargo test --workspace

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      # the wasm crate is excluded from the workspace, so it needs its own pass
      - name: Check wasm validator
        if: runner.os == 'Linux'
        working-directory: rust/crates/dcpdoctor-wasm
        run: |
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo fmt -- --check

  gui:
    name: GUI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gui/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/pnpm-lock.yaml

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: gui
        run: pnpm build

      - name: Build CLI sidecar
        working-directory: rust
        run: |
          cargo build --release -p dcpdoctor-cli
          TRIPLE=$(rustc -vV | grep host | awk '{print $2}')
          cp target/release/dcpdoctor ../gui/src-tauri/dcpdoctor-${TRIPLE}

      - name: Build GUI Rust
        run: cargo build --release --manifest-path gui/src-tauri/Cargo.toml

      - name: Test GUI Rust
        run: cargo test --manifest-path gui/src-tauri/Cargo.toml
