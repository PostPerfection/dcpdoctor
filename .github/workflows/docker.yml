name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: dcpdoctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Version and help
        run: |
          docker run --rm dcpdoctor:ci --version
          docker run --rm dcpdoctor:ci validate --help

      # exit 1 is a failed package, anything else means the run itself broke
      - name: XSD pass runs inside the image
        run: |
          status=0
          docker run --rm -v "$PWD/tests/fixtures/mxf_stub_package:/data/dcp:ro" dcpdoctor:ci validate -v /data/dcp > dcp-report.txt 2>&1 || status=$?
          cat dcp-report.txt
          [ "$status" -le 1 ]
          ! grep -q 'XSD validation did not run' dcp-report.txt

      - name: Photon pass runs inside the image
        run: |
          status=0
          docker run --rm -v "$PWD/tests/dcps/synthetic/minimal/minimal_imf:/data/imp:ro" dcpdoctor:ci validate -v /data/imp > imp-report.txt 2>&1 || status=$?
          cat imp-report.txt
          [ "$status" -le 1 ]
          grep -q '\[Photon\]' imp-report.txt
          ! grep -q -E '\[Photon\] deep IMF checks (skipped|did not finish)' imp-report.txt

      - name: REST API answers
        run: |
          cid=$(docker run -d --rm -p 127.0.0.1:18080:8080 -v "$PWD/tests/fixtures/mxf_stub_package:/data/dcp:ro" dcpdoctor:ci serve --bind 0.0.0.0 --port 8080)
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/health
          curl -fs -X POST -H 'Content-Type: application/json' -d '{"path": "/data/dcp"}' http://127.0.0.1:18080/validate | grep -q '"notes"'
          docker stop "$cid"
