[workspace]
members = ["crates/dcpdoctor-core", "crates/dcpdoctor-cli", "crates/dcpdoctor-imf", "crates/dcpdoctor-parse"]
exclude = ["crates/dcpdoctor-wasm"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.1"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dcpdoctor-imf = { path = "crates/dcpdoctor-imf" }
dcpdoctor-parse = { path = "crates/dcpdoctor-parse" }
postkit = { git = "https://github.com/PostPerfection/postkit.git", rev = "fc6cfe9" }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# consumers redirect this at their own postkit checkout so only one is compiled.
# the rev above must match the extern/postkit gitlink, and CI asserts it.
[patch."https://github.com/PostPerfection/postkit.git"]
postkit = { path = "../extern/postkit" }
